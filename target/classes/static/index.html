<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>reCAPTCHA - Policy-Based Challenge</title>

  <style>
    .grecaptcha-badge {
      visibility: hidden;
    }
  </style>
</head>
<body>

<h1>Login com reCAPTCHA PBC</h1>

<form id="loginForm">
  <div>
    <label>Usuário</label>
    <input id="username" type="text" value="" required>
  </div>

  <div>
    <label>Senha</label>
    <input id="password" type="password" value="" required>
  </div>

  <button type="submit">Entrar</button>
</form>

<pre id="result">Carregando configuração...</pre>

<script>
  let SITE_KEY = null;
  let ACTION = null;

  const result = document.getElementById("result");
  const form = document.getElementById("loginForm");

  /*
   * 1. FRONTEND busca a site key pública no backend.
   */
  async function loadConfig() {
    const response = await fetch("/api/recaptcha/config");
    const config = await response.json();

    SITE_KEY = config.siteKey;
    ACTION = config.action;

    /*
     * 2. FRONTEND carrega o JavaScript oficial do reCAPTCHA Enterprise.
     */
    const script = document.createElement("script");
    script.src = "https://www.google.com/recaptcha/enterprise.js?render=" + encodeURIComponent(SITE_KEY);
    script.async = true;
    script.defer = true;
    script.onload = () => {
      result.textContent = "reCAPTCHA carregado. Pronto para testar.";
    };

    document.head.appendChild(script);
  }

  /*
   * 3. FRONTEND executa o reCAPTCHA e recebe um token.
   */
  async function executeRecaptcha() {
    return new Promise((resolve, reject) => {
      grecaptcha.enterprise.ready(() => {
        grecaptcha.enterprise.execute(SITE_KEY, { action: ACTION })
          .then(resolve)
          .catch(reject);
      });
    });
  }

  /*
   * 4. FRONTEND envia o token para o backend.
   * 5. BACKEND cria a assessment no Google.
   */
  form.addEventListener("submit", async function(event) {
    event.preventDefault();

    try {
      result.textContent = "Executando reCAPTCHA...";

      const token = await executeRecaptcha();

      result.textContent = "Token gerado. Enviando para o backend...";

      const response = await fetch("/api/auth/login", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          username: document.getElementById("username").value,
          password: document.getElementById("password").value,
          recaptchaToken: token
        })
      });

      const payload = await response.json();

      result.textContent = JSON.stringify(payload, null, 2);

    } catch (error) {
      result.textContent = "Erro: " + error.message;
    }
  });

  loadConfig();
</script>

</body>
</html>
